<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Diary - 감성 광장</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/diary-list.css}">
</head>
<body class="sd-body">

	<main class="container-fluid sd-main">
		<div class="row g-4">

			<!-- 좌측: 통계/랭킹 -->
			<div class="col-lg-3">
				<div class="sd-search-panel sd-stats-panel">
					<h5 class="sd-label mb-3">오늘의 감성 랭킹</h5>
					<div id="rankingList"></div>
				</div>
			</div>

			<!-- 우측: 공개 게시물 목록 -->
			<div class="col-lg-9">
				<h2 class="sd-title">감성 광장</h2>
				<p class="sd-subtitle" id="diaryCount">불러오는 중...</p>

				<div class="sd-filter-group mb-4">
					<button type="button" class="btn sd-filter-btn active"
						data-filter="all">전체</button>
					<button type="button" class="btn sd-filter-btn" data-filter="sunny">☀️
						맑음</button>
					<button type="button" class="btn sd-filter-btn" data-filter="rainy">🌧️
						비</button>
					<button type="button" class="btn sd-filter-btn"
						data-filter="cloudy">☁️ 흐림</button>
					<button type="button" class="btn sd-filter-btn" data-filter="snowy">❄️
						눈</button>
				</div>

				<p class="sd-empty d-none" id="emptyMsg">아직 공개된 일기가 없어요.</p>
				<p class="sd-empty d-none" id="filterEmptyMsg">해당 날씨로 공개된 일기가
					없어요.</p>

				<div class="row g-4" id="diaryGrid"></div>

				<div id="scrollSentinel" style="height: 1px;"></div>
				<p id="loadingIndicator" class="sd-status">불러오는 중...</p>
				<p id="noMoreIndicator" class="sd-status d-none">더 이상 불러올 일기가
					없어요.</p>
			</div>
		</div>
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/community-list.js}"></script>
</body>
</html>
