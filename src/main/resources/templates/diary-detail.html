<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${diary.title} + ' - Sound Diary'">Sound Diary -
	일기 상세</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/diary-write.css}">
<link rel="stylesheet" th:href="@{/css/diary-detail.css}">
</head>
<body class="sd-body">
	<main class="container sd-main">
		<div class="row g-4 justify-content-center"
			th:with="wcat=${diary.weatherIcon != null ?
                (diary.weatherIcon.startsWith('01') ? 'sunny' :
                (diary.weatherIcon.startsWith('02') or diary.weatherIcon.startsWith('03') or diary.weatherIcon.startsWith('04') or diary.weatherIcon.startsWith('50') ? 'cloudy' :
                (diary.weatherIcon.startsWith('09') or diary.weatherIcon.startsWith('10') or diary.weatherIcon.startsWith('11') ? 'rainy' :
                (diary.weatherIcon.startsWith('13') ? 'snowy' : 'cloudy')))) : 'unknown'}">

			<div class="col-lg-4">
				<div class="sd-search-panel sd-cover-panel"
					th:style="${diary.albumImageUrl != null} ? ('--cover-bg: url(' + ${diary.albumImageUrl} + ')') : ''">
					<div th:if="${diary.trackName != null}">
						<img th:src="${diary.albumImageUrl}" alt=""
							class="sd-detail-cover">
						<div class="sd-detail-track-name" th:text="${diary.trackName}">곡명</div>
						<div class="sd-detail-track-artist" th:text="${diary.artistName}">아티스트</div>
					</div>
					<div th:unless="${diary.trackName != null}" class="sd-status">
						이 일기엔 연결된 음악이 없어요.</div>
				</div>
			</div>

			<div class="col-lg-6">
				<form class="sd-card" method="post"
					th:action="@{/diary/detail/{id}(id=${diary.diaryId})}"
					id="detailForm">

					<input type="hidden" name="isPublic" id="isPublicField"
						th:value="${diary.isPublic}">

					<div class="d-flex justify-content-between align-items-start mb-3">
						<h2 class="sd-title mb-0">일기 상세</h2>
						<span class="badge sd-badge sd-weather-badge-img"
							th:if="${diary.weatherIcon != null}"> <img
							th:src="'https://openweathermap.org/img/wn/' + ${diary.weatherIcon} + '@2x.png'"
							alt="" class="sd-detail-weather-icon"> <span
							th:text="${diary.weatherDesc}">날씨</span>
						</span>
						 <span class="badge sd-badge"
							th:unless="${diary.weatherIcon != null}">날씨 없음</span>
					</div>

					<div class="sd-detail-meta mb-4">
						<span th:if="${diary.locationName != null}"
							class="sd-detail-location"> <img
							th:src="@{/images/pin-icon.png}" alt="" class="sd-pin-icon">
							<span th:text="${diary.locationName}">위치</span>
						</span> <span th:if="${diary.weatherTemp != null}"
							th:text="${#numbers.formatDecimal(diary.weatherTemp, 1, 1) + '°C'}">기온</span>
						<span
							th:text="${#temporals.format(diary.createdAt, 'yyyy.MM.dd')}">날짜</span>
					</div>

					<div class="mb-3">
						<label class="form-label sd-label">일기 제목</label> <input
							type="text" name="title"
							class="form-control sd-input sd-detail-field" maxlength="20"
							th:value="${diary.title}" readonly>
					</div>

					<div class="mb-3">
						<label class="form-label sd-label">감성 및 일기</label>
						<textarea name="content"
							class="form-control sd-input sd-detail-field" rows="8"
							maxlength="2000" th:text="${diary.content}" readonly></textarea>
					</div>

					<!-- 보기 모드에선 숨김, 수정 모드에서만 노출 -->
					<div class="form-check form-switch mb-4 sd-switch d-none"
						id="publicToggleWrap" th:if="${isOwner}">
						<input class="form-check-input" type="checkbox"
							id="publicToggleUI" th:checked="${diary.isPublic == 'Y'}">
						<label class="form-check-label sd-label" for="publicToggleUI">이
							일기를 감성 광장에 공개하기</label>
					</div>

					<!-- 보기 모드일 때 공개 여부를 텍스트로만 표시 -->
					<div class="sd-status mb-3" id="publicStatusText"
						th:if="${isOwner}">
						<span
							th:text="${diary.isPublic == 'Y'} ? '🌍 감성 광장에 공개된 일기예요' : '🔒 나만 볼 수 있는 비공개 일기예요'"></span>
					</div>

					<div class="d-flex gap-2 mt-3" th:if="${isOwner}">
						<!-- 보기 모드 버튼 -->
						<button type="button" class="btn sd-save-btn flex-grow-1"
							id="editModeBtn">수정하기</button>
						<!-- 수정 모드 버튼 (기본 숨김) -->
						<button type="submit" class="btn sd-save-btn flex-grow-1 d-none"
							id="saveBtn">수정 저장</button>
						<button type="button" class="btn sd-btn-danger" id="deleteBtn"
							th:attr="data-id=${diary.diaryId}">삭제</button>
						<button type="button" class="btn sd-btn-outline d-none"
							id="cancelEditBtn">취소</button>
					</div>

					<a th:href="${backUrl}" class="btn sd-btn-outline w-100 mt-2">목록으로</a>
				</form>
			</div>
		</div>
	</main>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/diary-detail.js}"></script>
</body>
</html>
