<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Diary - 내 일기장</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/diary-list.css}">
</head>
<body class="sd-body">

	<main class="container-fluid sd-main">
		<div class="row g-4">

			<!-- 좌측: 음악 검색 (작성 화면과 동일 구조, 선택 시 바로 재생만 됨) -->
			<div class="col-lg-3">
				<div class="sd-search-panel sd-sticky-panel">
					<h5 class="sd-label mb-3">노래 찾기</h5>
					<div class="input-group mb-3">
						<input type="text" id="trackSearchInput"
							class="form-control sd-input" placeholder="곡명, 아티스트 검색" >
						<button type="button" class="btn sd-search-btn"
							id="trackSearchBtn">검색</button>
					</div>
					<div id="trackResults" class="sd-track-results"></div>
				</div>
			</div>

			<!-- 우측: 기존 일기 목록 -->
			<div class="col-lg-9">
				<h2 class="sd-title">내 음악 일기장</h2>
				<p class="sd-subtitle" id="diaryCount">불러오는 중...</p>

				<div class="sd-filter-group mb-4">
					<button type="button" class="btn sd-filter-btn active"
						data-filter="all">전체</button>
					<button type="button" class="btn sd-filter-btn" data-filter="sunny">
						<img src="https://openweathermap.org/img/wn/01d.png" alt=""
							class="sd-filter-icon">맑음
					</button>
					<button type="button" class="btn sd-filter-btn" data-filter="rainy">
						<img src="https://openweathermap.org/img/wn/10n.png" alt=""
							class="sd-filter-icon">비
					</button>
					<button type="button" class="btn sd-filter-btn"
						data-filter="cloudy">
						<img src="https://openweathermap.org/img/wn/03d.png" alt=""
							class="sd-filter-icon">흐림
					</button>
					<button type="button" class="btn sd-filter-btn" data-filter="snowy">
						<img src="https://openweathermap.org/img/wn/13d.png" alt=""
							class="sd-filter-icon">눈
					</button>
				</div>

				<p class="sd-empty d-none" id="emptyMsg">아직 작성된 일기가 없어요. 첫 기록을
					남겨보세요.</p>
				<p class="sd-empty d-none" id="filterEmptyMsg">해당 날씨로 작성된 일기가
					없어요.</p>

				<div class="row g-4" id="diaryGrid"></div>

				<div id="scrollSentinel" style="height: 1px;"></div>
				<p id="loadingIndicator" class="sd-status">불러오는 중...</p>
				<p id="noMoreIndicator" class="sd-status d-none">더 이상 불러올 일기가
					없어요.</p>
			</div>
		</div>
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/diary-list.js}"></script>
</body>
</html>
