<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Diary - 글쓰기</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/diary-write.css}">
</head>
<body class="sd-body">
	<main class="container-fluid sd-main">
		<div class="row g-4 justify-content-center">

			<!-- 좌측: 음악 검색 패널 -->
			<div class="col-lg-4">
				<div class="sd-search-panel">
					<h5 class="sd-label mb-3">노래 찾기</h5>
					<div class="input-group mb-3">
						<input type="text" id="trackSearchInput"
							class="form-control sd-input" placeholder="곡명, 아티스트 검색">
						<button type="button" class="btn sd-search-btn"
							id="trackSearchBtn">검색</button>
					</div>
					<div id="trackResults" class="sd-track-results"></div>
				</div>
			</div>

			<!-- 우측: 기존 일기 작성 폼 -->
			<div class="col-lg-6">
				<form class="sd-card" method="post">

					<input type="hidden" name="latitude" id="latitudeField"> <input
						type="hidden" name="longitude" id="longitudeField"> <input
						type="hidden" name="locationName" id="locationNameField">
					<input type="hidden" name="weatherIcon" id="weatherIconField">
					<input type="hidden" name="weatherDesc" id="weatherDescField">
					<input type="hidden" name="weatherTemp" id="weatherTempField">

					<!-- 신규: 선택한 트랙 정보 (검색 패널에서 클릭하면 채워짐) -->
					<input type="hidden" name="trackName" id="trackNameField">
					<input type="hidden" name="artistName" id="artistNameField">
					<input type="hidden" name="albumImageUrl" id="albumImageUrlField">
					<input type="hidden" name="spotifyTrackUri"
						id="spotifyTrackUriField">

					<h2 class="sd-title">오늘의 기록</h2>

					<!-- 선택된 곡 미리보기 -->
					<div class="sd-selected-track mb-3 d-none"
						id="selectedTrackPreview">
						<img id="selectedTrackImg" src="" alt="" class="sd-track-thumb">
						<div>
							<div class="sd-track-name" id="selectedTrackName"></div>
							<div class="sd-track-artist" id="selectedTrackArtist"></div>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label sd-label">오늘의 날씨</label>
						<div class="d-flex gap-2" id="weatherMoodGroup">
							<button type="button" class="btn sd-weather-btn" data-icon="01d"
								data-desc="맑음">
								<img src="https://openweathermap.org/img/wn/01d@2x.png" alt="맑음"
									class="sd-weather-icon-img"> 맑음
							</button>
							<button type="button" class="btn sd-weather-btn" data-icon="10n"
								data-desc="비">
								<img src="https://openweathermap.org/img/wn/10n@2x.png" alt="비"
									class="sd-weather-icon-img"> 비
							</button>
							<button type="button" class="btn sd-weather-btn" data-icon="03d"
								data-desc="흐림">
								<img src="https://openweathermap.org/img/wn/03d@2x.png" alt="흐림"
									class="sd-weather-icon-img"> 흐림
							</button>
							<button type="button" class="btn sd-weather-btn" data-icon="13d"
								data-desc="눈">
								<img src="https://openweathermap.org/img/wn/13d@2x.png" alt="눈"
									class="sd-weather-icon-img"> 눈
							</button>
						</div>
						<div class="sd-status" id="weatherStatus">날씨 불러오는 중…</div>
					</div>

					<div class="mb-3">
						<label class="form-label sd-label">일기 제목</label> <input
							type="text" name="title" class="form-control sd-input"
							maxlength="20" placeholder="오늘의 감정을 담은 제목을 적어주세요. (최대 20자)">
					</div>
					<div class="mb-3">
						<label class="form-label sd-label">감성 및 일기</label>
						<textarea name="content" class="form-control sd-input" rows="7"
							maxlength="2000" required
							placeholder="오늘 하루 이야기나 감상을 자유롭게 적어보세요. (최대 2,000자)"></textarea>
					</div>

					<div class="form-check form-switch mb-4 sd-switch">
						<input type="hidden" name="isPublic" id="isPublicField" value="N">
						<input class="form-check-input" type="checkbox"
							id="publicToggleUI"> <label
							class="form-check-label sd-label" for="publicToggleUI">이
							일기를 감성 광장에 공개하기</label>
					</div>
					<button type="submit" class="btn sd-save-btn w-100">등록하기</button>
				</form>
			</div>
		</div>
	</main>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/diary-write.js}"></script>
</body>
</html>
